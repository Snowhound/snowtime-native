# Checks the port on every PR and push to main: formatting, Clippy with and without bench,
# the Rust, adapter, and harness tests, the parity bar (conformance, compare.ts, and
# hardening-compare.ts against a bench build), the load patch against the pinned app,
# cargo-deny, cargo-audit, and whether THIRD_PARTY_LICENSES is current. On a PR that leaves the app's pin alone, page-compare.ts also renders every page
# on the base commit's host and this one and fails on any difference.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Job-level env can't read the runner context, so the V8 path is set here.
      - name: V8 library path
        run: echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/librusty_v8.a.gz" >> "$GITHUB_ENV"

      # app/ is the snowtime submodule at the pinned commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json

      # Installs rust-toolchain.toml's version and components.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.2

      - name: V8 library
        run: deploy/v8-archive.sh Cargo.lock "$RUSTY_V8_ARCHIVE"

      # The render crate embeds the app's server bundle, so the app builds first.
      - name: Render bundle
        run: |
          bun install --cwd app --frozen-lockfile
          bun install --cwd adapter --frozen-lockfile
          (cd app && bun --bun run build)
          bun adapter/build.ts

      - name: TypeScript, adapter, and harness tests
        run: |
          bun install --cwd adapter/bench --frozen-lockfile
          bunx tsc --noEmit -p .
          bun test adapter harness

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy with bench
        run: cargo clippy --locked --workspace --all-targets --features bench -- -D warnings

      - name: Tests
        run: |
          cargo test --locked -p snowtime-server
          cargo test --locked -p snowtime-server --features bench
          cargo test --locked -p snowtime-host
          cargo test --locked -p snowtime-render

      # The bar the pin must pass (README, "Run it"): the app's conformance tests and the
      # port's, then byte comparisons against the app's TypeScript build.
      - name: Parity with the app
        run: |
          cargo build --locked -p snowtime-host --features bench
          bun harness/conformance.ts target/debug/snowtime-axum
          bun harness/compare.ts target/debug/snowtime-axum
          bun harness/hardening-compare.ts target/debug/snowtime-axum

      # deploy/load/app.patch must still apply to the pinned app, type-check, and pass its
      # tests; app/ is restored after, so later steps see the pinned commit.
      - name: Load patch
        run: |
          git -C app apply ../deploy/load/app.patch
          bunx tsc --noEmit -p tsconfig.load.json
          (cd app && bun test perf/stress)
          git -C app checkout -- .
          git -C app clean -fd -- perf deploy

      - name: cargo-deny
        run: |
          cargo deny --locked check
          cargo deny --locked --all-features check

      - name: cargo-audit
        run: cargo audit

      - name: Third-party licenses are current
        run: |
          cargo fetch --locked
          licenses/generate.sh
          git diff --exit-code THIRD_PARTY_LICENSES

      # Pages may change only when the pin moves, so a PR that moves it skips this.
      - name: Pages match the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$BASE" HEAD -- app; then
            echo "::notice title=Page comparison skipped::This PR moves the app's pin."
            exit 0
          fi
          cargo build --locked -p snowtime-host
          git worktree add ../base "$BASE"
          (
            cd ../base
            git submodule update --init
            bun install --cwd app --frozen-lockfile
            bun install --cwd adapter --frozen-lockfile
            (cd app && bun --bun run build)
            bun adapter/build.ts
            # The base may lock another v8, so it gets its own checked library.
            deploy/v8-archive.sh Cargo.lock "$RUNNER_TEMP/base-v8.a.gz"
            RUSTY_V8_ARCHIVE="$RUNNER_TEMP/base-v8.a.gz" CARGO_TARGET_DIR="$RUNNER_TEMP/base" \
              cargo build --locked -p snowtime-host
          )
          bun harness/page-compare.ts "$RUNNER_TEMP/base/debug/snowtime-axum" target/debug/snowtime-axum
