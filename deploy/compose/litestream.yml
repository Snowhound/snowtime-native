# Litestream 0.5: streams the database's changes to S3-compatible storage, such as Hetzner
# Object Storage, Cloudflare R2, or MinIO (README.md, "Backups"). The LITESTREAM_* values
# come from litestream.env.
dbs:
  - path: /data/snowtime.db
    replica:
      type: s3
      endpoint: ${LITESTREAM_ENDPOINT}
      region: ${LITESTREAM_REGION}
      bucket: ${LITESTREAM_BUCKET}
      path: snowtime
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
      # Hetzner, R2, and MinIO all take bucket names in the path.
      force-path-style: true
      sync-interval: 1s

# A full snapshot a day, kept for a week: a restore can go back to any point in that week.
snapshot:
  interval: 24h
  retention: 168h
