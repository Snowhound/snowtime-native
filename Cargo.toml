[workspace]
resolver = "3"
# The render crate, and so the host, needs its JavaScript bundle built first
# (crates/render/README.md).
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
snowtime-server = { path = "crates/server" }

axum = "0.8"
base64 = "0.23"
form_urlencoded = "1"
hmac = "0.13"
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
rustc-hash = "2"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

# The fork's fixes on top of the pinned better-auth-rs commit, each offered upstream (task
# 081.39, docs/tasks/better-auth-rs/upstream.md).
[patch."https://github.com/better-auth-rs/better-auth-rs"]
better-auth = { git = "https://github.com/kaitk/better-auth-rs", rev = "1508ab7977892857f1deee1f69b73e0f8704b6f4" }
better-auth-core = { git = "https://github.com/kaitk/better-auth-rs", rev = "1508ab7977892857f1deee1f69b73e0f8704b6f4" }
better-auth-api = { git = "https://github.com/kaitk/better-auth-rs", rev = "1508ab7977892857f1deee1f69b73e0f8704b6f4" }
